name: Build iOS package

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  GOPROXY: https://proxy.golang.org,direct
  GOSUMDB: sum.golang.org

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: hongguojian
            arguments: ''
          - edition: zhenguojian
            arguments: '--all-sources'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: 工具链版本
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          xcode-select -p
          pod --version
          go version
          flutter --version

      - name: 解析依赖
        run: |
          set -euo pipefail
          flutter pub get
          git --no-pager diff --stat -- pubspec.lock || true

      - name: 构建 iOS 包
        run: python3 scripts/build_ios.py ${{ matrix.arguments }}

      - name: 核对产物
        run: |
          set -euo pipefail
          ls -lh dist/ios/
          ipa=$(find dist/ios -name '*-ios-unsigned.ipa' | head -n1)
          test -n "$ipa" || {
            echo "未生成未签名 IPA" >&2
            exit 1
          }
          unzip -l "$ipa" | grep -q 'Payload/' || {
            echo "IPA 缺少 Payload 目录，无法安装：$ipa" >&2
            exit 1
          }
          cat dist/ios/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.edition }}-ios
          path: dist/ios/*
          if-no-files-found: error
          retention-days: 90
